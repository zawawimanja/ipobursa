name: Sync MITI Applicants (Scheduled)

on:
  schedule:
    # Berjalan setiap 2 jam waktu pasaran MYT (00:00, 02:00, 04:00, 06:00, 08:00, 10:00 UTC)
    # Jimat kuota percuma GitHub Actions (2000 minit/bulan) daripada terbakar setiap 5 minit
    - cron: '0 0-10/2 * * 1-5'
  workflow_dispatch: # Boleh klik bila-bila masa secara manual

concurrency:
  group: git-repo-sync
  cancel-in-progress: false

jobs:
  sync-miti:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Test sync and website logic
        run: npm test

      - name: Sync MITI Portal Dates & Active Offers (SPSKB 3.0)
        run: |
          node scripts/run-sync-step.js miti-portal scratch/sync-miti-portal-dates.js
        continue-on-error: true

      - name: Sync MITI Applicants (login terus, tanpa CAPTCHA)
        env:
          MITI_USERNAME: ${{ secrets.MITI_USERNAME }}
          MITI_PASSWORD: ${{ secrets.MITI_PASSWORD }}
        run: |
          # Login portal SahamOnline MITI terus (kredential dari secrets) —
          # update tarikh tawaran MITI. Tiada cookies Chrome, laptop tak perlu on.
          if [ -n "$MITI_USERNAME" ] && [ -n "$MITI_PASSWORD" ]; then
            node scripts/run-sync-step.js miti-applicants scratch/sync-miti-applicants-login.js --no-push
          else
            node scripts/run-sync-step.js miti-applicants --skip "MITI credentials are not configured."
          fi
        continue-on-error: true

      - name: Regenerate IPO profiles from final source data
        run: node scripts/run-sync-step.js ipo-pages generate-ipo-pages.js

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json data.js data_export.js overrides.json sync-status.js ipo/ sitemap.xml
          git diff --staged --quiet || (git commit -m "Automated update: MITI applicants" && git pull --rebase origin main && git push)

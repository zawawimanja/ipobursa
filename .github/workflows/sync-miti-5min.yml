name: Sync MITI Applicants (Scheduled)

on:
  schedule:
    # Berjalan setiap 2 jam waktu pasaran MYT (00:00, 02:00, 04:00, 06:00, 08:00, 10:00 UTC)
    # Jimat kuota percuma GitHub Actions (2000 minit/bulan) daripada terbakar setiap 5 minit
    - cron: '0 0-10/2 * * 1-5'
  workflow_dispatch: # Boleh klik bila-bila masa secara manual

concurrency:
  group: git-repo-sync
  cancel-in-progress: false

jobs:
  sync-miti:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Test sync and website logic
        run: npm test

      - name: Sync MITI Portal Dates & Active Offers (SPSKB 3.0)
        id: miti_portal
        run: |
          node scripts/run-sync-step.js miti-portal --managed-status scratch/sync-miti-portal-dates.js
        continue-on-error: true

      - name: Sync MITI offer details (authenticated portal)
        id: miti_details
        env:
          MITI_USERNAME: ${{ secrets.MITI_USERNAME }}
          MITI_PASSWORD: ${{ secrets.MITI_PASSWORD }}
        run: |
          # The login script needs a real Chromium through Puppeteer, which is not part
          # of the locked CI dependencies, so it only runs where Puppeteer is installed.
          if ! node -e "import('puppeteer').then(() => process.exit(0), () => process.exit(1))" >/dev/null 2>&1; then
            node scripts/run-sync-step.js miti-applicants --skip "Puppeteer is not installed in CI; run scratch/sync-miti-applicants-login.js locally."
          elif [ -z "$MITI_USERNAME" ] || [ -z "$MITI_PASSWORD" ]; then
            node scripts/run-sync-step.js miti-applicants --skip "MITI credentials are not configured."
          else
            node scripts/run-sync-step.js miti-applicants --managed-status scratch/sync-miti-applicants-login.js --no-push
          fi
        continue-on-error: true

      - name: Regenerate IPO profiles from final source data
        run: node scripts/run-sync-step.js ipo-pages generate-ipo-pages.js

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json data.js data_export.js overrides.json sync-status.js ipo/ sitemap.xml
          git diff --staged --quiet || (git commit -m "Automated update: MITI applicants" && git pull --rebase origin main && git push)

      - name: Report pipeline health (blocked external sources stay warnings)
        if: always()
        run: node scripts/check-sync-sources.js --only ipo-pages

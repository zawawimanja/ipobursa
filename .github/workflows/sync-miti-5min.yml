name: Sync MITI Applicants (5 min)

on:
  schedule:
    # Setiap 5 minit, 24/7 (pemohon boleh apply walau hujung minggu/cuti —
    # nombor sentiasa berubah). Hari bekerja sahaja.
    - cron: '*/5 * * * 1-5'
  workflow_dispatch: # Allows manual click run

jobs:
  sync-miti:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Sync MITI Applicants (login terus, tanpa CAPTCHA)
        env:
          MITI_USERNAME: ${{ secrets.MITI_USERNAME }}
          MITI_PASSWORD: ${{ secrets.MITI_PASSWORD }}
        run: |
          # Login portal SahamOnline MITI terus (kredential dari secrets) —
          # update "Jumlah Pelabur Mohon Saham" + "Jumlah Tawaran Saham".
          # Tiada cookies Chrome, tiada CAPTCHA, laptop tak perlu on.
          node scratch/sync-miti-applicants-login.js --no-push
        continue-on-error: true

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json data.js data_export.js overrides.json
          git diff --staged --quiet || (git commit -m "Automated update: MITI applicants" && git pull --rebase origin main && git push)